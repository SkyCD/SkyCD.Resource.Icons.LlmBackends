name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git submodule update --init --depth 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SkyCD.Resource.Icons.LlmBackends.csproj --locked-mode
      - run: dotnet format SkyCD.Resource.Icons.LlmBackends.csproj --verify-no-changes --no-restore
      - run: dotnet format tools/IconBuild/IconBuild.csproj --verify-no-changes --no-restore
      - name: Build, pack and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '0.0.0-ci'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
              throw 'Use a release tag such as v0.1.1.'
            }
            $version = $Matches[1]
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          }
          dotnet pack SkyCD.Resource.Icons.LlmBackends.csproj -c Release --no-restore "-p:PackageVersion=$version" -o artifacts
          dotnet run --project tools/IconBuild -c Release --no-build -- verify "artifacts/SkyCD.Resource.Icons.LlmBackends.$version.nupkg"
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  required-checks:
    name: Required checks
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: nuget-package
      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push '*.nupkg' --api-key "$NUGET_AUTH_TOKEN" --source https://nuget.pkg.github.com/SkyCD/index.json --skip-duplicate
      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}" \
              --notes '[Install from SkyCD GitHub Packages](https://github.com/orgs/SkyCD/packages/nuget/package/SkyCD.Resource.Icons.LlmBackends).'
          fi
